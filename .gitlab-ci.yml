# .gitlab-ci.yml was automatically generated by the command:
# /home/szampini/Devel/petsc/lib/petsc/bin/maint/runjobs.py -f linux-pkgs-opt linux-pkgs-dbg
#
# stage-1 take only a few minutes; they do not run the full test suite or external packages.
#
# stage-2 runs on MCS systems and may take 10 to 15 minutes. They run the full test suite but with limited mixture of external packages
#
# stage-3 runs on MCS systems and may take an hour or more. They run the full test suite and heavily test external packages, utilize valgrind etc
#
# The stage-(n) tests are only started if all of the stage-(n-1) tests run without error
#   You can limit the testing by using the variable STAGE with value 1 or 2
#

stages:
  - stage-1
  - stage-2
  - stage-3
  - stage-4
variables:
  GIT_STRATEGY: fetch
  GIT_CLEAN_FLAGS: -ffdxq
  TIMEOUT: 450
  BASE_EXTRA_OPTIONS: -nox -nox_warning -malloc_dump
  UCX_LOG_LEVEL: error

#
# The most basic template that most tests will expand upon
#

.test-basic:
  interruptible: true
  only:
    refs:
      #     Set with CI/CD Shedules - New Schedule
      - schedules
      - api
      #     Set with CI/CD Pipelines - Run Pipeline
      - web
      - merge_requests
  dependencies: []

.test:
  extends: .test-basic
  except:
    variables:
      # Skip if a reduced-pipeline label is attached to a merge request
      - $CI_MERGE_REQUEST_LABELS =~ /(^|,)docs-only($|,)/
      - $CI_MERGE_REQUEST_LABELS =~ /(^|,)petsc4py-only($|,)/
      - $PETSC_CI_SCHEDULED =~ /yes/

# Keep petsc4py jobs in the petsc4py-only pipeline; docs-only still takes precedence.
# List this template last in extends so it overrides .test exclusions.
.test-petsc4py:
  except:
    variables:
      - $CI_MERGE_REQUEST_LABELS =~ /(^|,)docs-only($|,)/
      - $PETSC_CI_SCHEDULED =~ /yes/

check-ci-settings:
  extends: .test-basic
  stage: .pre
  tags:
    - gce-stage1
  script:
    - lib/petsc/bin/maint/check-ci-settings.sh

#
#  This provides the basic order of operations and options template for cloud based stage 1 tests.
#  Not all test-short need to follow this template but most will.
#

.stage-1:
  extends: .test
  stage: stage-1
  tags:
    - gce-u24-stage1
  before_script:
    - date
    - hostname
    - grep PRETTY_NAME /etc/os-release
    - nproc
    - lscpu
    - ccache --zero-stats
  script:
    - if [ ! -z ${LOAD_MODULES+x} ]; then module --trace load ${LOAD_MODULES}; module list; fi
    - if [ ! -z ${INIT_SCRIPT+x} ]; then echo "sourcing ${INIT_SCRIPT}"; if [ -f ${HOME}/${INIT_SCRIPT} ]; then source ${HOME}/${INIT_SCRIPT}; else source ${INIT_SCRIPT}; fi; fi
    - printf "PATH:$PATH\n"
    - printf "PYTHONPATH:$PYTHONPATH\n"
    - printf "python:${PYTHON}\n"
    - ${PYTHON} -m pip list --user
    - printf "CONFIG_OPTS:${CONFIG_OPTS}\n"
    - printf "EXTRA_OPTIONS_INITIAL:$EXTRA_OPTIONS_INITIAL $BASE_EXTRA_OPTIONS\n"
    - printf "MODULEPATH:$MODULEPATH\n"
    - if [ ! -z ${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME+x} ]; then printf "CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME\n" ;fi
    - ${PYTHON} ./configure --with-debugging=0 COPTFLAGS='-O3 -march=native' CXXOPTFLAGS='-O3 -march=native' FOPTFLAGS='-O3 -march=native' ${CONFIG_OPTS}
    - make CFLAGS="${MAKE_CFLAGS}" CXXFLAGS="${MAKE_CXXFLAGS}" FFLAGS="${MAKE_FFLAGS}" CUDAFLAGS="${MAKE_CUDAFLAGS}"
    - if [ ! -z ${ENABLE_CHECK+x} ]; then make CFLAGS="${MAKE_CFLAGS}" CXXFLAGS="${MAKE_CXXFLAGS}" FFLAGS="${MAKE_FFLAGS}" CUDAFLAGS="${MAKE_CUDAFLAGS}" EXTRA_OPTIONS_INITIAL="${EXTRA_OPTIONS_INITIAL} ${BASE_EXTRA_OPTIONS}" check; fi
    - make CFLAGS="${MAKE_TEST_CFLAGS}" CXXFLAGS="${MAKE_TEST_CXXFLAGS}" FFLAGS="${MAKE_TEST_FFLAGS}" CUDAFLAGS="${MAKE_CUDAFLAGS}" EXTRA_OPTIONS_INITIAL="${EXTRA_OPTIONS_INITIAL} ${BASE_EXTRA_OPTIONS}" allgtests-tap gmakesearch="${TEST_SEARCH}" TIMEOUT=${TIMEOUT}
    - if [ ! -z ${ENABLE_COMPILETESTS+x} ]; then make -j 16 CFLAGS="${MAKE_TEST_CFLAGS}" CXXFLAGS="${MAKE_TEST_CXXFLAGS}" FFLAGS="${MAKE_TEST_FFLAGS}" EXTRA_OPTIONS_INITIAL="${EXTRA_OPTIONS_INITIAL} ${BASE_EXTRA_OPTIONS}" test PRINTONLY=1; fi
  variables:
    PYTHON: python3
    MAKE_CFLAGS: -Werror -Wmissing-field-initializers
    MAKE_CXXFLAGS: -Werror -Wzero-as-null-pointer-constant
    MAKE_FFLAGS: -Werror -fimplicit-none
    MAKE_TEST_CFLAGS: -Werror
    MAKE_TEST_CXXFLAGS: -Werror
    MAKE_TEST_FFLAGS: -Werror
  after_script:
    - date
    - ccache --show-stats
  artifacts:
    reports:
      junit: arch-*/tests/testresults.xml
    name: "$CI_JOB_NAME"
    when: always
    paths:
      - arch-*/lib/petsc/conf/*.log
      - arch-*/lib/pkgconfig/petsc.pc
      - arch-*/tests/testresults.xml
      - arch-*/tests/test_*_tap.log
      - arch-*/tests/test_*_err.log
    expire_in: 4 days

#
# The following tests run on the cloud as part of stage-1.
#

checksource:
  extends: .test-basic
  stage: .pre
  tags:
    - gce-u24-stage1
  script:
    - python3 ./configure --with-mpi=0 --with-fc=0 --with-cxx=0 --with-coverage-exec=0 --with-syclc=0 --with-hipc=0 --with-cudac=0 --with-x=0 --with-bison=0 --with-cmake=0 --with-pthread=0 --with-mkl_sparse_optimize=0 --with-mkl_sparse=0 --with-debugging=0
    - vermin --version
    - make vermin
    - PATH=/nfs/gce/projects/petsc/soft/LLVM-23.1.0-Linux-X64/bin:$PATH make checkclangformat checkfprettifyformat SHELL=bash
    - make checkbadSource SHELL=bash
    - if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ] && ! git cat-file -e "$CI_MERGE_REQUEST_DIFF_BASE_SHA^{commit}"; then git fetch -q --no-tags --depth=1 origin "$CI_MERGE_REQUEST_DIFF_BASE_SHA"; fi
    - make checkbadFileChange CHECKBADFILECHANGE_BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA" SHELL=bash
    - make checkbadManualPages SHELL=bash
    - make -f gmakefile check_output SHELL=bash
    - make check_petsc4py_rst
    - make -C src/binding/petsc4py lint
    - PATH=/nfs/gce/projects/petsc/soft/shellcheck-stable:$PATH make checkshellcheck SHELL=bash
  artifacts:
    name: "$CI_JOB_NAME"
    when: always
    paths:
      - arch-*/lib/petsc/conf/*.patch
      - arch-*/lib/petsc/conf/*.log
    expire_in: 4 days

.ai-review:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  stage: .pre
  tags:
    - feature:ai
  variables:
    # Metrics go to the Grafana Cloud OTLP gateway. Required CI/CD variables:
    #   GRAFANA_CLOUD_OTLP_ENDPOINT - gateway base URL; not a secret
    #   GRAFANA_CLOUD_OTLP_TOKEN    - base64("<instance-id>:<api-token>"); masked, NOT
    #                                 protected (protected ones are absent on MR refs)
    # The export interval is short so the last flush precedes shutdown, and Prometheus
    # stores cumulative, not delta.
    #
    # Claude Code. user.email, user.id and organization.id have no opt-out.
    CLAUDE_CODE_ENABLE_TELEMETRY: "1"
    OTEL_METRICS_EXPORTER: otlp
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_EXPORTER_OTLP_ENDPOINT: "$GRAFANA_CLOUD_OTLP_ENDPOINT"
    OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Basic $GRAFANA_CLOUD_OTLP_TOKEN"
    OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
    # ci.job is omitted: the CLI attaches a unique-per-run session.id, so a per-job
    # label would double series churn for no query power.
    OTEL_RESOURCE_ATTRIBUTES: "ci.mr=$CI_MERGE_REQUEST_IID,ci.ref=$CI_COMMIT_REF_SLUG"
    OTEL_METRIC_EXPORT_INTERVAL: "10000"
    OTEL_METRICS_INCLUDE_ACCOUNT_UUID: "false"
    #
    # opencode, via opencode-plugin-otel (https://github.com/DEVtheOPS/opencode-plugin-otel)
    # on the runner, which writes the OTEL_ equivalents itself. Metrics only: logs and spans
    # could carry the MR diff. Inert until a paid opencode model, as AI_TIER=free unsets these.
    OPENCODE_ENABLE_TELEMETRY: "1"
    OPENCODE_OTLP_PROTOCOL: http/protobuf
    OPENCODE_OTLP_ENDPOINT: "$GRAFANA_CLOUD_OTLP_ENDPOINT"
    OPENCODE_OTLP_HEADERS: "Authorization=Basic $GRAFANA_CLOUD_OTLP_TOKEN"
    OPENCODE_OTLP_METRICS_INTERVAL: "10000"
    OPENCODE_OTLP_METRICS_TEMPORALITY: cumulative
    OPENCODE_RESOURCE_ATTRIBUTES: "ci.mr=$CI_MERGE_REQUEST_IID,ci.ref=$CI_COMMIT_REF_SLUG"
    OPENCODE_DISABLE_LOGS: "1"
    OPENCODE_DISABLE_TRACES: all
  before_script:
    - date
    - hostname
  script:
    - $AI_CLI --version || { echo "$AI_CLI not installed"; exit 1; }
    - glab --version || { echo "glab not installed"; exit 1; }
    - python3 --version || { echo "python3 not installed"; exit 1; }
    - echo "$CI_MERGE_REQUEST_IID" | grep -qE '^[0-9]+$' || { echo "invalid MR IID"; exit 1; }
    - |
      if [ "$AI_TIER" = "free" ] || [ -z "$GRAFANA_CLOUD_OTLP_ENDPOINT" ] || [ -z "$GRAFANA_CLOUD_OTLP_TOKEN" ]; then
        echo "Disabling telemetry: free model, or Grafana OTLP variables not set"
        unset CLAUDE_CODE_ENABLE_TELEMETRY OTEL_METRICS_EXPORTER OTEL_EXPORTER_OTLP_ENDPOINT OTEL_EXPORTER_OTLP_HEADERS
        unset OPENCODE_ENABLE_TELEMETRY OPENCODE_OTLP_ENDPOINT OPENCODE_OTLP_HEADERS
      fi
      if echo "$CI_MERGE_REQUEST_LABELS" | grep -qF 'Post AI review'; then
        test -n "$GITLAB_TOKEN" || { echo "GITLAB_TOKEN not set"; exit 1; }
        REVIEW_SKILL="review-mr-post"
      else
        unset GITLAB_TOKEN
        REVIEW_SKILL="review-mr"
      fi
      if [ "$AI_CLI" = "opencode" ]; then
        # stderr is dropped, not captured: it is very verbose and dumps the environment.
        # --variant sets reasoning effort; providers defining no variants ignore it.
        opencode run --model "$AI_MODEL" --variant xhigh --auto "Review MR $CI_MERGE_REQUEST_IID using the skill $REVIEW_SKILL" 2> /dev/null
      elif [ "$AI_CLI" = "claude" ]; then
        # 200 turns: large MRs hit the 30-turn default before the review finished.
        claude -p "/${REVIEW_SKILL} ${CI_MERGE_REQUEST_IID}" --model "$AI_MODEL" --dangerously-skip-permissions --max-turns 200
      else
        echo "unknown AI_CLI '$AI_CLI'; expected claude or opencode"; exit 1
      fi
  timeout: 1h
  allow_failure: true
  interruptible: true
  environment:
    name: AI-Review/$AI_MODEL/$CI_COMMIT_REF_SLUG
    url: https://$CI_PROJECT_NAMESPACE.gitlab.io/-/$CI_PROJECT_NAME/-/jobs/$CI_JOB_ID/artifacts/ai-review.html
    auto_stop_in: one week
    deployment_tier: development
  artifacts:
    when: always
    paths:
      - ai-review.*
      # one glob for meta (always written) and findings (posting runs only), so the glob always matches and never warns
      - mr-*.json
      - mr-*-diff.txt
    expire_in: one week

ai-review:
  extends: .ai-review
  parallel:
    matrix:
      - AI_CLI: claude
        AI_MODEL: [sonnet, opus]
        AI_TIER: paid
      - AI_CLI: opencode
        AI_MODEL: [alcf/nemotron, opencode/spark]
        AI_TIER: free

#
# Basic template for code coverage generation. Tests should additionally inherit from the more
# specialized OS-specific versions instead of this one.
#

.coverage-generate:
  variables:
    RUN_GCOV: 1
    RUN_GCOV_OPTIONS: --decisions

.coverage-disable:
  variables:
    RUN_GCOV: 0

#
# This provides the basic order of operations and options template for stage-2,3 tests.
# Not all stage-2,3 need to follow this template, but most will.
#
.stage-23:
  extends:
    - .test
    - .coverage-generate
  script:
    - if [ ! -z ${LOAD_MODULES+x} ]; then module --trace load ${LOAD_MODULES}; module list; fi
    - if [ ! -z ${GCOV_MODULES+x} ]; then module --trace load ${GCOV_MODULES}; module list; fi
    - if [ ! -z ${INIT_SCRIPT+x} ]; then echo "sourcing ${INIT_SCRIPT}"; if [ -f ${HOME}/${INIT_SCRIPT} ]; then source ${HOME}/${INIT_SCRIPT}; else source ${INIT_SCRIPT}; fi; fi
    - if [ "${RUN_GCOV}" == 1 ]; then
      printf "RUN_GCOV_OPTIONS:$RUN_GCOV_OPTIONS\n";
      gcovr --version;
      fi
    - if [ -d ${HOME}/petsc-hash-pkgs/ ]; then find ${HOME}/petsc-hash-pkgs/ -maxdepth 1 -mindepth 1 -type d -mtime +25 -exec touch {} \; -exec rm -rf {} \; ; fi
    - printf "PATH:$PATH\n"
    - printf "PYTHONPATH:$PYTHONPATH\n"
    - printf "EXTRA_OPTIONS_INITIAL:$EXTRA_OPTIONS_INITIAL $BASE_EXTRA_OPTIONS\n"
    - if [ ! -z ${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME+x} ]; then printf "CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME\n" ;fi
    - printf "./config/examples/${TEST_ARCH}.py\n"
    - cat ./config/examples/${TEST_ARCH}.py
    - ./config/examples/${TEST_ARCH}.py || if [ -f naglicenseproblem ]; then exit 126; else exit 1; fi
    - make CFLAGS="${MAKE_CFLAGS}" CXXFLAGS="${MAKE_CXXFLAGS}" FFLAGS="${MAKE_FFLAGS}" CUDAFLAGS="${MAKE_CUDAFLAGS}" || if [ -f naglicenseproblem ]; then exit 126; else exit 1; fi
    - export ASAN_OPTIONS="log_path=stdout:detect_leaks=false" UBSAN_OPTIONS="suppressions=${PWD}/share/petsc/suppressions/ubsan" # only needed for -fsanitize=undefined (but harmless otherwise)
    - make CFLAGS="${MAKE_CFLAGS}" CXXFLAGS="${MAKE_CXXFLAGS}" FFLAGS="${MAKE_FFLAGS}" CUDAFLAGS="${MAKE_CUDAFLAGS}" EXTRA_OPTIONS_INITIAL="${EXTRA_OPTIONS_INITIAL} ${BASE_EXTRA_OPTIONS}" check || if [ -f naglicenseproblem ]; then exit 126; else exit 1; fi
    - make updatedatafiles
    - if [ -z ${DISABLE_PETSC4PY_TESTS+x} ]; then if [ -z ${ENABLE_PETSC4PY_LDPRELOAD+x} ]; then echo "NOT using LD_PRELOAD"; make EXTRA_OPTIONS_INITIAL="${EXTRA_OPTIONS_INITIAL} ${BASE_EXTRA_OPTIONS}" petsc4pytest; else echo "using LD_PRELOAD"; LD_PRELOAD=${PWD}/${TEST_ARCH}/lib/libpetsc.so make EXTRA_OPTIONS_INITIAL="${EXTRA_OPTIONS_INITIAL} ${BASE_EXTRA_OPTIONS}" petsc4pytest; fi; fi
    - if [ -z ${DISABLE_TESTS+x} ]; then make cleantest && make CFLAGS="${MAKE_CFLAGS}" CXXFLAGS="${MAKE_CXXFLAGS}" FFLAGS="${MAKE_FFLAGS}" CUDAFLAGS="${MAKE_CUDAFLAGS}"  EXTRA_OPTIONS_INITIAL="${EXTRA_OPTIONS_INITIAL} ${BASE_EXTRA_OPTIONS}" allgtests-tap TIMEOUT=${TIMEOUT} ${TEST_OPTS} || if [ -f naglicenseproblem ]; then exit 126; else exit 1; fi; fi
    - if [ "${RUN_GCOV}" == 1 ]; then make gcov PETSC_GCOV_OPTIONS="${RUN_GCOV_OPTIONS}"; fi
  artifacts:
    reports:
      junit: arch-*/tests/testresults.xml
    name: "$CI_JOB_NAME"
    when: always
    paths:
      - arch-*/lib/petsc/conf/*.log
      - arch-*/lib/pkgconfig/petsc.pc
      - arch-*/tests/testresults.xml
      - arch-*/tests/test_arch-*_tap.log
      - arch-*/tests/test_arch-*_err.log
      - arch-*/arch-*-gcovr-report.json.tar.bz2
    expire_in: 4 days
  variables:
    OPENBLAS_NUM_THREADS: 1

.stage-2:
  extends: .stage-23
  stage: stage-2

.stage-3:
  extends: .stage-23
  stage: stage-3

